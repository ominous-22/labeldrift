[[label]]
value = "ENACTED"
constant = "CONGRESS_STATUS_ENACTED"
context = ["congressional", "cls_congressional"]

[[label]]
value = "FAILED"
constant = "CONGRESS_STATUS_FAILED"
context = ["congressional", "cls_congressional"]

[[label]]
value = "BILL"
constant = "RECORD_BILL"
context = ["congressional", "cls_congressional"]

[[label]]
value = "RESOLUTION"
constant = "RECORD_RESOLUTION"
context = ["congressional", "cls_congressional"]

[[label]]
value = "HEARING"
constant = "RECORD_HEARING"
context = ["congressional", "cls_congressional"]

[[label]]
value = "AMENDMENT"
