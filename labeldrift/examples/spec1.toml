# Example: the exact rule set SPEC-1's bespoke check_hardcoded_labels.py
# script encoded by hand. This is what it looks like generalized.

[source]
module = "spec1_labels"

[[label]]
value = "CRITICAL"
constant = "PRIORITY_CRITICAL"
context = ["cls_leads"]

[[label]]
value = "HIGH"
constant = "PRIORITY_HIGH or THREAT_HIGH"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "MEDIUM"
constant = "PRIORITY_MEDIUM or THREAT_MEDIUM"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "LOW"
constant = "PRIORITY_LOW or THREAT_LOW"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "HIGH_RISK"
constant = "PSYOP_HIGH_RISK"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "MEDIUM_RISK"
constant = "PSYOP_MEDIUM_RISK"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "LOW_RISK"
constant = "PSYOP_LOW_RISK"
context = ["cls_psyop", "cls_leads"]

[[label]]
value = "CLEAN"
constant = "PSYOP_CLEAN"
